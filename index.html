<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cup And Go - Loyalty Pass</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: #f3f4f6; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .container { width: 100%; max-width: 380px; }
        
        .login-card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; }
        .login-card h2 { color: #1f2937; margin-top: 0; }
        input { width: 100%; padding: 14px; border: 1.5px solid #e5e7eb; border-radius: 12px; font-size: 16px; text-align: center; margin-bottom: 12px; outline: none; }
        input:focus { border-color: #ff6b00; }
        
        .pass-card { background: #3b231d; color: white; border-radius: 24px; padding: 25px; box-shadow: 0 15px 35px rgba(59,35,29,0.3); text-align: center; }
        .brand-title { font-size: 22px; font-weight: 800; margin: 0; }
        .brand-sub { font-size: 13px; color: #d7ccc8; margin-top: 4px; }
        
        .stamps-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0; }
        .stamp-slot { aspect-ratio: 1; background: rgba(255,255,255,0.08); border: 1.5px dashed rgba(255,255,255,0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #d7ccc8; font-weight: 700; }
        .stamp-slot.filled { background: #ff6b00; border: none; color: white; box-shadow: 0 4px 12px rgba(255,107,0,0.4); }
        
        .qr-wrapper { background: white; padding: 12px; border-radius: 16px; display: inline-block; margin: 5px 0 10px; }
        .btn { width: 100%; padding: 14px; background: #ff6b00; color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div class="login-card" id="loginScreen">
        <h2>☕ Cup And Go</h2>
        <p style="color: #6b7280; font-size: 14px; margin-bottom: 20px;">Enter your name & phone number</p>
        <input type="text" id="userName" placeholder="Your Name">
        <input type="tel" id="userPhone" placeholder="05XXXXXXXX">
        <button class="btn" onclick="registerUser()">Open My Card</button>
    </div>

    <div class="pass-card" id="passScreen" style="display: none;">
        <div class="brand-title">Cup And Go</div>
        <div class="brand-sub">Collect 7 cups and get 1 free drink!</div>

        <div style="margin: 15px 0 5px; text-align: left; font-size: 14px;">
            Hello, <span id="displayName" style="color: #ff6b00; font-weight: bold;"></span>
        </div>

        <div class="stamps-container">
            <div class="stamp-slot" id="s1">1</div>
            <div class="stamp-slot" id="s2">2</div>
            <div class="stamp-slot" id="s3">3</div>
            <div class="stamp-slot" id="s4">4</div>
            <div class="stamp-slot" id="s5">5</div>
            <div class="stamp-slot" id="s6">6</div>
            <div class="stamp-slot" id="s7">7</div>
            <div class="stamp-slot" id="s8">🎁</div>
        </div>

        <div class="qr-wrapper">
            <div id="qrcode"></div>
        </div>
        
        <p style="font-size: 12px; color: #d7ccc8; margin: 5px 0 15px;">Show this code to the cashier at the counter</p>
        <button class="btn" style="background: rgba(255,255,255,0.15); font-size: 14px; padding: 10px;" onclick="location.reload()">Sign out</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI8tfzkWABqaAB9e0KGPj0",
        authDomain: "cup-and-go-53e2d.firebaseapp.com",
        projectId: "cup-and-go-53e2d",
        storageBucket: "cup-and-go-53e2d.firebasestorage.app",
        messagingSenderId: "555868986103",
        appId: "1:555868986103:web:3a89b804a7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function registerUser() {
        const name = document.getElementById("userName").value.trim();
        const phone = document.getElementById("userPhone").value.trim();
        if(!name || !phone) return alert("Please enter name and phone number");

        db.collection("loyalty").doc(phone).get().then((doc) => {
            if(!doc.exists) {
                db.collection("loyalty").doc(phone).set({
                    name: name,
                    phone: phone,
                    stamps: 0,
                    totalVisits: 0,
                    createdAt: new Date()
                });
            }
            openCard(phone, name);
        });
    }

    function openCard(phone, defaultName) {
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("passScreen").style.display = "block";

        new QRCode(document.getElementById("qrcode"), { text: phone, width: 130, height: 130 });

        db.collection("loyalty").doc(phone).onSnapshot((doc) => {
            if(doc.exists) {
                const data = doc.data();
                document.getElementById("displayName").innerText = data.name || defaultName;
                const stamps = data.stamps || 0;

                for(let i=1; i<=8; i++) {
                    const slot = document.getElementById("s" + i);
                    if(i <= stamps) {
                        slot.classList.add("filled");
                        slot.innerHTML = "☕";
                    } else {
                        slot.classList.remove("filled");
                        slot.innerHTML = i === 8 ? "🎁" : i;
                    }
                }
            }
        });
    }
</script>
</body>
</html>
