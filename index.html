<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cup And Go - Loyalty</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; }
        body { background: #121212; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 15px; }
        .app-wrapper { width: 100%; max-width: 380px; }
        
        /* Customer Digital Card */
        .pass-card { background: #3b231d; border-radius: 24px; padding: 25px 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); text-align: center; border: 1px solid rgba(255,255,255,0.1); transition: background 0.3s; }
        .brand-name { font-size: 24px; font-weight: 800; color: #fff; }
        .brand-sub { font-size: 13px; color: #d7ccc8; margin-top: 4px; }
        
        .stamps-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 25px 0; }
        .slot { aspect-ratio: 1; background: rgba(255,255,255,0.08); border: 1.5px dashed rgba(255,255,255,0.3); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; color: #d7ccc8; }
        .slot.active { background: #ff6b00; border-color: #ff6b00; color: white; box-shadow: 0 4px 12px rgba(255,107,0,0.4); }

        .qr-box { background: white; padding: 12px; border-radius: 16px; display: inline-block; margin-bottom: 12px; }
        
        /* Admin Panels */
        .admin-panel { background: #222; border-radius: 24px; padding: 20px; text-align: center; display: none; }
        input, select { width: 100%; padding: 12px; border: 1px solid #444; background: #333; color: white; border-radius: 10px; font-size: 14px; margin-bottom: 10px; outline: none; }
        label { display: block; text-align: left; font-size: 12px; color: #bbb; margin-bottom: 4px; font-weight: 600; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
        .btn-orange { background: #ff6b00; color: white; }
        .btn-gray { background: rgba(255,255,255,0.1); color: #aaa; font-size: 12px; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <!-- 1. Customer Card Screen -->
    <div class="pass-card" id="customerCard">
        <div class="brand-name" id="uiBrandName">Cup And Go</div>
        <div class="brand-sub" id="uiOfferText">Collect stamps & get free drinks! 🎁</div>

        <div class="stamps-grid" id="stampsContainer"></div>

        <div class="qr-box">
            <div id="qrcode"></div>
        </div>
        
        <p style="font-size: 12px; color: #a89f91; margin-bottom: 15px;">Show this QR code at the counter</p>
        <button class="btn btn-gray" onclick="toggleAdmin()">⚙️ Cashier & Settings Mode</button>
    </div>

    <!-- 2. Admin Hub (Scanner & Live Customizer) -->
    <div class="admin-panel" id="adminScreen">
        <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
            <button class="btn btn-orange" style="margin:0; padding:8px 15px; font-size:13px; width:48%;" onclick="showTab('scan')">📷 QR Scanner</button>
            <button class="btn btn-gray" style="margin:0; padding:8px 15px; font-size:13px; width:48%;" onclick="showTab('settings')">🎨 Settings</button>
        </div>

        <!-- Tab 1: Scanner -->
        <div id="tabScan">
            <div id="reader" style="border-radius: 14px; overflow: hidden; margin-bottom: 15px;"></div>
            
            <div id="scanResult" style="display: none; background: #333; padding: 15px; border-radius: 12px; margin-bottom: 15px; text-align:left;">
                <p style="font-size: 13px; color: #bbb;">Customer ID: <b id="lblCustId" style="color:white;"></b></p>
                <p style="font-size: 20px; font-weight: 800; color: #ff6b00; margin: 8px 0;">Stamps: <span id="lblStamps">0</span></p>
                <button class="btn btn-orange" onclick="addStampToCustomer()">➕ Add +1 Stamp ☕</button>
                <button class="btn" style="background:#dc2626; color:white;" onclick="resetCustomerStamps()">🎁 Redeem Free Cup (Reset)</button>
            </div>
        </div>

        <!-- Tab 2: Customization Settings -->
        <div id="tabSettings" style="display:none; text-align:left;">
            <label>Brand / Shop Name</label>
            <input type="text" id="cfgBrand" placeholder="e.g. Cup And Go">

            <label>Offer Text</label>
            <input type="text" id="cfgOffer" placeholder="e.g. Collect 7 cups & get 1 free!">

            <label>Total Stamps (কত কাপে অফার)</label>
            <select id="cfgSlots">
                <option value="5">5 Stamps (4 Cups + 1 Free)</option>
                <option value="6">6 Stamps (5 Cups + 1 Free)</option>
                <option value="7">7 Stamps (6 Cups + 1 Free)</option>
                <option value="8">8 Stamps (7 Cups + 1 Free)</option>
                <option value="10">10 Stamps (9 Cups + 1 Free)</option>
            </select>

            <label>Card Color</label>
            <select id="cfgBg">
                <option value="#3b231d">Dark Coffee</option>
                <option value="#1e293b">Slate Dark Blue</option>
                <option value="#0f172a">Pitch Black</option>
                <option value="#ff6b00">Vibrant Orange</option>
            </select>

            <button class="btn btn-orange" onclick="saveCustomSettings()">Save & Update Live</button>
        </div>

        <button class="btn btn-gray" onclick="toggleAdmin()">Back to Customer Pass</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI8tfzkWABqaAB9e0KGPj0",
        authDomain: "cup-and-go-53e2d.firebaseapp.com",
        projectId: "cup-and-go-53e2d",
        storageBucket: "cup-and-go-53e2d.firebasestorage.app",
        messagingSenderId: "555868986103",
        appId: "1:555868986103:web:3a89b804a7"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let totalSlots = 8;
    let cardBg = "#3b231d";

    // 1. Live Configuration Sync
    db.collection("settings").doc("card_config").onSnapshot((doc) => {
        if(doc.exists) {
            const data = doc.data();
            if(data.brandName) {
                document.getElementById("uiBrandName").innerText = data.brandName;
                document.getElementById("cfgBrand").value = data.brandName;
            }
            if(data.offerText) {
                document.getElementById("uiOfferText").innerText = data.offerText;
                document.getElementById("cfgOffer").value = data.offerText;
            }
            if(data.totalSlots) {
                totalSlots = parseInt(data.totalSlots);
                document.getElementById("cfgSlots").value = data.totalSlots;
            }
            if(data.cardBg) {
                cardBg = data.cardBg;
                document.getElementById("customerCard").style.backgroundColor = cardBg;
                document.getElementById("cfgBg").value = cardBg;
            }
            renderCustomerStamps();
        }
    });

    // 2. Customer ID & Storage
    let myCustomerId = localStorage.getItem("cup_customer_id");
    if(!myCustomerId) {
        myCustomerId = "CUP-" + Math.floor(100000 + Math.random() * 900000);
        localStorage.setItem("cup_customer_id", myCustomerId);
        db.collection("loyalty").doc(myCustomerId).set({ stamps: 0, visits: 1, createdAt: new Date() });
    }

    new QRCode(document.getElementById("qrcode"), { text: myCustomerId, width: 130, height: 130 });

    let myStamps = 0;
    db.collection("loyalty").doc(myCustomerId).onSnapshot((doc) => {
        myStamps = (doc.exists && doc.data().stamps) ? doc.data().stamps : 0;
        renderCustomerStamps();
    });

    function renderCustomerStamps() {
        const grid = document.getElementById("stampsContainer");
        grid.innerHTML = "";
        for(let i = 1; i <= totalSlots; i++) {
            const slot = document.createElement("div");
            slot.className = "slot" + (i <= myStamps ? " active" : "");
            slot.innerHTML = (i <= myStamps) ? "☕" : (i === totalSlots ? "🎁" : i);
            grid.appendChild(slot);
        }
    }

    // 3. Admin & Navigation
    let scannedId = "";
    let scannerObj = null;

    function toggleAdmin() {
        const custCard = document.getElementById("customerCard");
        const adminCard = document.getElementById("adminScreen");

        if(adminCard.style.display === "none" || adminCard.style.display === "") {
            const pin = prompt("Enter Cashier PIN (Default: 1234):");
            if(pin === "1234") {
                custCard.style.display = "none";
                adminCard.style.display = "block";
                showTab('scan');
            } else {
                alert("Incorrect PIN!");
            }
        } else {
            adminCard.style.display = "none";
            custCard.style.display = "block";
            if(scannerObj) scannerObj.clear();
        }
    }

    function showTab(tab) {
        document.getElementById("tabScan").style.display = tab === 'scan' ? 'block' : 'none';
        document.getElementById("tabSettings").style.display = tab === 'settings' ? 'block' : 'none';
        if(tab === 'scan') startScanner();
        else if(scannerObj) scannerObj.clear();
    }

    function startScanner() {
        if(!scannerObj) {
            scannerObj = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 200 });
            scannerObj.render((text) => {
                scannedId = text.trim();
                fetchScannedData(scannedId);
            });
        }
    }

    function fetchScannedData(id) {
        db.collection("loyalty").doc(id).get().then((doc) => {
            if(doc.exists) {
                document.getElementById("scanResult").style.display = "block";
                document.getElementById("lblCustId").innerText = id;
                document.getElementById("lblStamps").innerText = doc.data().stamps || 0;
            } else {
                alert("Unregistered Customer QR");
            }
        });
    }

    function addStampToCustomer() {
        if(!scannedId) return;
        const ref = db.collection("loyalty").doc(scannedId);
        db.runTransaction((t) => {
            return t.get(ref).then((doc) => {
                let s = (doc.data().stamps || 0) + 1;
                let v = (doc.data().visits || 0) + 1;
                t.update(ref, { stamps: s, visits: v });
                return s;
            });
        }).then((newS) => {
            document.getElementById("lblStamps").innerText = newS;
            alert("Stamp added! Customer's card updated live ☕");
        });
    }

    function resetCustomerStamps() {
        if(!scannedId) return;
        if(confirm("Redeem free cup and reset to 0?")) {
            db.collection("loyalty").doc(scannedId).update({ stamps: 0 }).then(() => {
                document.getElementById("lblStamps").innerText = 0;
                alert("Reward Claimed! Pass reset to 0.");
            });
        }
    }

    function saveCustomSettings() {
        const b = document.getElementById("cfgBrand").value.trim() || "Cup And Go";
        const o = document.getElementById("cfgOffer").value.trim() || "Collect stamps & get free drinks!";
        const s = document.getElementById("cfgSlots").value;
        const bg = document.getElementById("cfgBg").value;

        db.collection("settings").doc("card_config").set({
            brandName: b,
            offerText: o,
            totalSlots: s,
            cardBg: bg
        }).then(() => {
            alert("Settings updated! All cards synced live.");
            showTab('scan');
        });
    }
</script>
</body>
</html>
