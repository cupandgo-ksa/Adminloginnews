<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cup And Go - Cashier Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; text-align: center; }
        .box { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 400px; margin: auto; }
        h2 { color: #333; margin-top: 0; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; }
        .btn { background: #ff7a00; color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn-claim { background: #28a745; }
        .info { background: #fff8f0; border: 1px solid #ffe0b2; padding: 15px; border-radius: 10px; margin-top: 15px; text-align: left; }
    </style>
</head>
<body>

<div class="box">
    <h2>Cup And Go Admin</h2>
    <div id="reader"></div>

    <div id="customer-view" class="info" style="display:none;">
        <p><strong>Customer:</strong> <span id="disp-id"></span></p>
        <p><strong>Total Stamps:</strong> <span id="disp-stamps" style="font-size: 24px; color: #ff7a00; font-weight: bold;"></span> / 5</p>
        <button class="btn" onclick="addStamp()">+1 Add Stamp</button>
        <button class="btn btn-claim" id="claim-btn" style="display:none;" onclick="claimReward()">🎁 Redeem Free Drink</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDI8tfzkWABqaAB9e0KGPj0",
        authDomain: "cup-and-go-53e2d.firebaseapp.com",
        projectId: "cup-and-go-53e2d",
        storageBucket: "cup-and-go-53e2d.firebasestorage.app",
        messagingSenderId: "555868986103",
        appId: "1:555868986103:web:3a89b804a7",
        measurementId: "G-YKV4SQDD4C"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let activeCustomer = "";
    let totalStamps = 0;

    function onScanSuccess(decodedText) {
        activeCustomer = decodedText;
        loadCustomer(decodedText);
    }

    const scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
    scanner.render(onScanSuccess);

    function loadCustomer(id) {
        db.collection("loyalty").doc(id).get().then((doc) => {
            if (doc.exists) {
                totalStamps = doc.data().stamps || 0;
            } else {
                totalStamps = 0;
                db.collection("loyalty").doc(id).set({ stamps: 0, joined: new Date() });
            }
            renderUI();
        });
    }

    function renderUI() {
        document.getElementById("customer-view").style.display = "block";
        document.getElementById("disp-id").innerText = activeCustomer;
        document.getElementById("disp-stamps").innerText = totalStamps;
        document.getElementById("claim-btn").style.display = totalStamps >= 5 ? "block" : "none";
    }

    function addStamp() {
        totalStamps++;
        db.collection("loyalty").doc(activeCustomer).update({ stamps: totalStamps }).then(() => {
            alert("1 Stamp added successfully!");
            renderUI();
        });
    }

    function claimReward() {
        if (confirm("Redeem free reward for this customer?")) {
            totalStamps = 0;
            db.collection("loyalty").doc(activeCustomer).update({ stamps: 0 }).then(() => {
                alert("Reward redeemed! Stamps reset to 0.");
                renderUI();
            });
        }
    }
</script>
</body>
</html>
